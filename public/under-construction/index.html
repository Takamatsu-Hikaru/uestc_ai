<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>网站正在施工中 · UESTC AI</title>
<style>
  :root{
    --paper:#f4f1ea; --surface:#fbfaf7;
    --ink:#20211e; --ink-2:#454740; --muted:#777a72; --quiet:#96988f;
    --line:#d5d1c8; --line-dark:#bdb9b0; --coral:#c85c42; --danger:#a94438;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font:15px/1.7 "Avenir Next","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:470px; background:var(--surface);
    border:1px solid var(--line); border-top:3px solid var(--coral);
    padding:38px 40px 34px;
  }
  .mark{width:52px;height:52px;border-radius:50%;object-fit:contain;display:block;margin-bottom:22px}
  .eyebrow{display:flex;align-items:center;gap:9px;color:var(--quiet);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .eyebrow i{background:var(--coral);display:inline-block;height:1px;width:23px;font-style:normal}
  h1{
    font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif;
    font-size:31px; font-weight:400; line-height:1.25; letter-spacing:0;
    margin:16px 0 12px;
  }
  p.lede{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 28px}
  form{display:grid;gap:9px;margin:0}
  label{color:var(--ink-2);font-size:14px;font-weight:600}
  input{
    width:100%; min-height:46px; padding:11px 13px; background:#fff;
    border:1px solid var(--line-dark); border-radius:0; color:var(--ink);
    font:inherit; font-size:15px;
  }
  input:focus{outline:2px solid var(--coral);outline-offset:2px;border-color:var(--coral)}
  button{
    margin-top:7px; min-height:46px; padding:12px 16px; background:var(--ink);
    border:0; color:var(--paper); font:inherit; font-size:14px; cursor:pointer;
    transition:background .18s ease,transform .18s ease;
  }
  button:hover{background:var(--coral);transform:translateY(-1px)}
  button:active{transform:scale(.99)}
  .err{
    display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:10px 12px;
    background:#f0ddda;border-left:3px solid var(--danger);color:var(--danger);font-size:13px;
  }
  .err[hidden]{display:none}
  footer{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--quiet);font-size:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-dark)}
  footer a:hover{color:var(--coral);border-bottom-color:var(--coral)}
  @media(max-width:520px){
    .card{padding:30px 24px 26px}
    h1{font-size:26px}
  }
</style>
</head>
<body>
<main class="card">
  <!-- Inline mark: this page must render before the gate is unlocked, so it
       cannot reference /favicon.svg or any other site asset. -->
  <img class="mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%23c85c42'/%3E%3Ctext x='20' y='26' font-family='Georgia,serif' font-size='16' fill='%23f4f1ea' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E" alt="">
  <span class="eyebrow"><i></i>UESTC AI</span>
  <h1>网站正在施工中</h1>
  <p class="lede">开发完成后此页面会移除。如需访问，请输入授权码。</p>

  <p class="err" id="err" hidden>授权码不正确，请再试一次。</p>

  <form action="/__unlock" method="get" autocomplete="off">
    <label for="code">授权码</label>
    <input id="code" name="code" type="password" required autofocus
           autocomplete="off" spellcheck="false" aria-describedby="err">
    <button type="submit">进入</button>
  </form>

  <footer>
    <span>UESTC AI 社</span>
    <a href="https://wiki.uestcai.top">研究入门指南</a>
  </footer>
</main>
<script>
  // The code is validated by nginx, not here — nothing secret ships in this page.
  if (new URLSearchParams(location.search).has('e')) {
    var e = document.getElementById('err');
    e.hidden = false;
    document.getElementById('code').select();
  }
</script>
</body>
</html>
